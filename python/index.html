<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> بايثون - </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #295340;
            --primary-dark: #1a3d2e;
            --secondary-color: #dddcea;
            --dark-bg: #222222;
        }

        * { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-bg) 100%);
            min-height: 100vh;
            padding: 2rem 0;
            direction: rtl;
        }

        .container { max-width: 1100px; }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle { font-size: 1.15rem; opacity: 0.9; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.3rem;
            background: rgba(255,255,255,0.15);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.25s;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .back-btn:hover { background: rgba(255,255,255,0.28); color: white; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .subject-card {
            background: white;
            border-radius: 15px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .subject-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }
        .subject-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 0.4rem 1.1rem;
            border-radius: 25px;
            font-weight: 600;
            margin-bottom: 0.9rem;
            font-size: 0.85rem;
        }
        .card-title {
            color: var(--dark-bg);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            font-size: 0.9rem;
            padding-top: 0.9rem;
            border-top: 1px solid #eee;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-subtitle {
            color: #666;
            margin: -0.3rem 0 0.7rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .bab-badge {
            background: linear-gradient(135deg, #1c3f5f, #2a6f97) !important;
        }
        .bab-card::before {
            background: linear-gradient(90deg, #2a6f97, #a9d6e5) !important;
        }
        .bab-card .card-title { font-size: 1.5rem; }

        .summary-badge {
            background: linear-gradient(135deg, #7a5901, #b98a00) !important;
        }
        .summary-card::before {
            background: linear-gradient(90deg, #b98a00, #ffe08a) !important;
        }

        /* تنسيق محتوى الملخص (Markdown) */
        .md-content { line-height: 1.9; color: #2b2b2b; font-size: 1.05rem; }
        .md-content h1, .md-content h2, .md-content h3,
        .md-content h4 { color: var(--primary-color); margin: 1.4rem 0 0.7rem; font-weight: 700; }
        .md-content h1 { font-size: 1.8rem; border-bottom: 2px solid var(--secondary-color); padding-bottom: 0.4rem; }
        .md-content h2 { font-size: 1.45rem; }
        .md-content h3 { font-size: 1.2rem; }
        .md-content p { margin: 0.7rem 0; }
        .md-content ul, .md-content ol { padding-inline-start: 1.6rem; margin: 0.7rem 0; }
        .md-content li { margin: 0.35rem 0; }
        .md-content a { color: var(--primary-color); text-decoration: underline; }
        .md-content code {
            background: #f0f2f1; padding: 0.15rem 0.4rem; border-radius: 5px;
            font-family: monospace; direction: ltr; display: inline-block;
        }
        .md-content pre {
            background: #1e1e1e; color: #eaeaea; padding: 1rem; border-radius: 10px;
            overflow-x: auto; direction: ltr; text-align: left;
        }
        .md-content pre code { background: transparent; color: inherit; padding: 0; }
        .md-content blockquote {
            border-inline-start: 4px solid var(--primary-color);
            background: #f4f8f6; margin: 1rem 0; padding: 0.6rem 1rem; border-radius: 6px; color: #444;
        }
        .md-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        .md-content th, .md-content td { border: 1px solid #ddd; padding: 0.5rem 0.8rem; text-align: right; }
        .md-content th { background: var(--primary-color); color: white; }
        .md-content img { max-width: 100%; height: auto; border-radius: 8px; }
        .md-content hr { border: none; border-top: 1px solid #e2e2e2; margin: 1.5rem 0; }

        .loading, .state-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: white;
            font-size: 1.15rem;
        }

        /* Quiz */
        .quiz-progress {
            color: white;
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }
        .instant-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: white;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            margin-bottom: 1.2rem;
            background: rgba(255,255,255,0.12);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.22);
        }
        .instant-toggle input { display: none; }
        .instant-toggle .switch {
            position: relative;
            width: 44px; height: 24px;
            background: rgba(255,255,255,0.35);
            border-radius: 24px;
            transition: background 0.25s;
            flex: 0 0 auto;
        }
        .instant-toggle .switch::before {
            content: '';
            position: absolute;
            top: 3px; right: 3px;
            width: 18px; height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.25s;
        }
        .instant-toggle input:checked + .switch { background: #ffc107; }
        .instant-toggle input:checked + .switch::before { transform: translateX(-20px); }

        .quiz-question {
            background: white;
            border-radius: 12px;
            padding: 1.3rem 1.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }
        .quiz-question.answered .quiz-option { cursor: default; }
        .quiz-question.answered .quiz-option:hover {
            border-color: #e6e6e6; background: white;
        }
        .quiz-question.answered .quiz-option.selected:hover { background: #e8f1ec; }
        .quiz-question.answered .quiz-option.correct:hover { background: #d4edda; border-color: #1e7e34; }
        .quiz-question.answered .quiz-option.incorrect:hover { background: #f8d7da; border-color: #c82333; }
        .q-text {
            font-weight: 700;
            color: var(--dark-bg);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            line-height: 1.7;
            /* الحفاظ على الأسطر والمسافات البادئة في أسئلة الكود، مع اتجاه تلقائي لكل سطر */
            white-space: pre-wrap;
            unicode-bidi: plaintext;
        }
        /* أسطر الكود داخل السؤال تُعرض بخط أحادي المسافة وباتجاه إنجليزي */
        .q-text .code-block {
            display: block;
            font-family: 'Courier New', monospace;
            font-weight: 600;
            direction: ltr;
            text-align: left;
            background: #f4f6f8;
            border: 1px solid #e3e7ea;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            margin-top: 0.6rem;
            font-size: 0.98rem;
            line-height: 1.5;
            overflow-x: auto;
        }
        .q-text .q-prompt { white-space: pre-wrap; }
        .q-num {
            color: var(--primary-color);
            font-weight: 700;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border: 2px solid #e6e6e6;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            /* عرض الخيارات من اليسار لليمين (الحرف على اليسار ثم النص) */
            direction: ltr;
            text-align: left;
        }
        .quiz-option > span:last-child { flex: 1; }
        .quiz-option:hover { border-color: var(--primary-color); background: #f4f8f6; }
        .quiz-option.selected { border-color: var(--primary-color); background: #e8f1ec; }
        .quiz-option.correct { border-color: #1e7e34; background: #d4edda; }
        .quiz-option.incorrect { border-color: #c82333; background: #f8d7da; }
        .quiz-option .opt-letter {
            flex: 0 0 auto;
            width: 28px; height: 28px;
            display: inline-flex;
            align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--secondary-color);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .quiz-option.correct .opt-letter { background: #1e7e34; color: white; }
        .quiz-option.incorrect .opt-letter { background: #c82333; color: white; }

        .explanation {
            margin-top: 0.8rem;
            padding: 0.7rem 1rem;
            background: #f4f8f6;
            border-right: 4px solid var(--primary-color);
            border-radius: 6px;
            color: #333;
            font-size: 0.95rem;
            display: none;
        }
        .explanation.show { display: block; }

        .quiz-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .quiz-btn {
            flex: 1 1 auto;
            min-width: 160px;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            color: white;
        }
        .quiz-btn.check { background: var(--primary-color); }
        .quiz-btn.check:hover { background: var(--primary-dark); }
        .quiz-btn.reset { background: #6c757d; }
        .quiz-btn.reset:hover { background: #565e64; }

        .results {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 1.8rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
        }
        .results .score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .results .grade { font-size: 1.3rem; font-weight: 700; }
        .grade-pass { color: #1e7e34; }
        .grade-mid { color: #d39e00; }
        .grade-fail { color: #c82333; }

        /* ===== تحسينات UX ===== */
        .top-actions {
            display: flex;
            justify-content: flex-start;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
        }
        .pill-btn, .link-btn, .chip { font-family: inherit; cursor: pointer; }
        .pill-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(255,255,255,0.15); color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.55rem 1.1rem; border-radius: 25px;
            font-weight: 600; transition: all 0.2s;
        }
        .pill-btn:hover { background: rgba(255,255,255,0.28); }
        .count-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 22px; height: 22px; padding: 0 6px;
            background: #ffc107; color: #4a3800; border-radius: 12px;
            font-size: 0.8rem; font-weight: 700; margin-inline-start: 0.3rem;
        }

        .quiz-toggles { display: flex; gap: 0.8rem; flex-wrap: wrap; }

        .saved-note {
            color: #fff; background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.22);
            padding: 0.55rem 1rem; border-radius: 10px;
            margin-bottom: 1rem; font-size: 0.95rem;
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
        }
        .link-btn {
            background: none; border: none; color: #ffd76a;
            text-decoration: underline; padding: 0;
            font-weight: 600; font-size: inherit;
        }

        .quiz-progressbar {
            position: sticky; top: 0; z-index: 20;
            background: rgba(20,30,25,0.92);
            backdrop-filter: blur(4px);
            padding: 0.7rem 0.9rem; border-radius: 12px;
            margin-bottom: 1.2rem; border: 1px solid rgba(255,255,255,0.15);
        }
        .qp-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; }
        .qp-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffc107, #ffe08a); transition: width 0.3s; }
        .qp-meta {
            display: flex; justify-content: space-between; align-items: center;
            color: #fff; font-weight: 600; font-size: 0.9rem; margin-top: 0.5rem;
            gap: 0.5rem; flex-wrap: wrap;
        }

        .res-breakdown { display: flex; gap: 1rem; justify-content: center; margin: 0.8rem 0; flex-wrap: wrap; }
        .rb { font-weight: 700; font-size: 1rem; }
        .rb.ok { color: #1e7e34; }
        .rb.bad { color: #c82333; }
        .res-actions { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 0.5rem; }
        .chip {
            border: 2px solid var(--primary-color); background: #fff;
            color: var(--primary-color); padding: 0.45rem 1rem;
            border-radius: 25px; font-weight: 700; font-size: 0.9rem; transition: all 0.2s;
        }
        .chip.active { background: var(--primary-color); color: #fff; }

        .history-list { display: flex; flex-direction: column; gap: 0.6rem; }
        .history-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 1rem; padding: 0.7rem 0.9rem; border: 1px solid #eee;
            border-radius: 10px; background: #fafafa; flex-wrap: wrap;
        }
        .hr-title { font-weight: 700; color: var(--dark-bg); }
        .hr-meta { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .hr-score { font-weight: 700; }
        .hr-date { color: #888; font-size: 0.85rem; }

        /* إتاحة الوصول: إبراز العنصر المركّز عليه */
        [data-activate]:focus-visible, .quiz-btn:focus-visible,
        .chip:focus-visible, .link-btn:focus-visible, .pill-btn:focus-visible {
            outline: 3px solid #ffd76a; outline-offset: 2px;
        }
        .quiz-option:focus-visible { outline: 3px solid var(--primary-color); outline-offset: 2px; }

        @media (max-width: 768px) {
            body { padding: 1rem 0; }
            .header h1 { font-size: 1.7rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .quiz-btn { min-width: 100%; }
            .quiz-toggles { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fab fa-python"></i> بايثون</h1>
        </div>

        <div id="app">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> جاري تحميل الأسئلة...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
    // ===== إعدادات =====
    // مصدر الأسئلة: يحاول Supabase أولاً (جدول python_questions)، وإن فشل أو كان فارغاً
    // يرجع تلقائياً لملف CSV المحلي — فالصفحة تعمل قبل إنشاء الجدول وبعده دون أي تعديل.
    const USE_SUPABASE   = true;                 // اجعلها false لاستخدام ملف CSV فقط
    const QUESTIONS_TABLE = 'python_questions';   // جدول Supabase الخاص بأسئلة بايثون
    const QUESTIONS_CSV   = 'questions.csv';      // ملف CSV المحلي (احتياطي/افتراضي)
    const SHOW_SUMMARIES = false;                 // إظهار بطاقات الشرح (الملخصات)؟ false = أسئلة فقط
    const SUPABASE_URL = 'https://nytuekgasognqvzxemsh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DssZGrSuDi2u9sqTBvtI9A_r1INTSwW';
    const CONFIG_TABLE = 'app_config';   // مفتاح الإغلاق/الفتح
    const PAGE_KEY = 'python';

    const OPTION_KEYS = ['a', 'b', 'c', 'd'];
    let ALL_QUESTIONS = [];
    let SECTIONS = [];      // [{ name, subsections: [{name, questions:[]}], count }]
    let SUMMARIES = [];     // [{ section, title, file }] من summaries/summaries.json
    let dataReady = false;  // صار جاهزاً للتوجيه (routing) بعد تحميل البيانات

    // ===== تخزين محلي (حفظ التقدّم، التفضيلات، سجل النتائج) =====
    const LS_PREFS    = 'py_prefs';      // { instant, shuffle }
    const LS_PROGRESS = 'py_progress';   // { [quizKey]: { answers, checked, title, t } }
    const LS_HISTORY  = 'py_history';    // [{ t, key, title, correct, total }]
    const LS_REVIEW   = 'py_review';     // [ سؤال أُجيب خطأً بعد التسليم (مع _title) ]

    function loadPrefs()    { try { return JSON.parse(localStorage.getItem(LS_PREFS)) || {}; } catch (_) { return {}; } }
    function savePrefs(p)   { try { localStorage.setItem(LS_PREFS, JSON.stringify(p)); } catch (_) {} }
    function loadProgress() { try { return JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; } catch (_) { return {}; } }
    function saveProgress(a){ try { localStorage.setItem(LS_PROGRESS, JSON.stringify(a)); } catch (_) {} }
    function loadHistory()  { try { return JSON.parse(localStorage.getItem(LS_HISTORY)) || []; } catch (_) { return []; } }
    function saveHistory(h) { try { localStorage.setItem(LS_HISTORY, JSON.stringify(h)); } catch (_) {} }
    function loadReview()   { try { return JSON.parse(localStorage.getItem(LS_REVIEW)) || []; } catch (_) { return []; } }
    function saveReview(a)  { try { localStorage.setItem(LS_REVIEW, JSON.stringify(a)); } catch (_) {} }

    // إضافة سؤال أُجيب خطأً إلى بنك المراجعة (دون تكرار)
    function addWrongToReview(q, title) {
        const bank = loadReview();
        if (!bank.some(x => x.id === q.id)) { bank.push({ ...q, _title: title || '' }); saveReview(bank); }
    }
    // إزالة سؤال من بنك المراجعة (عند إجابته صحيحاً)
    function removeFromReview(id) {
        const bank = loadReview();
        const next = bank.filter(x => x.id !== id);
        if (next.length !== bank.length) saveReview(next);
    }

    // خلط عناصر مصفوفة (Fisher–Yates) دون تعديل الأصل
    function shuffled(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // ===== الأبواب =====
    // كل قسم يقع في أول باب تُطابقه إحدى عباراته؛ 'sections: "*"' = يلتقط كل ما تبقّى.
    // لإضافة باب جديد لاحقاً: أضف عنصراً بعبارات أقسامه، والباب صاحب "*" يبقى ملاذاً للباقي.
    const BABS = [
        {
            title: 'الشابتر الثاني',
            subtitle: 'المتغيرات والتعبيرات والجُمل — Variables, Expressions & Statements',
            sections: [
                'المتغيرات والتعبيرات'
            ]
        },
        {
            title: 'الشابتر الثالث',
            subtitle: 'التنفيذ الشرطي — Conditional Execution',
            sections: [
                'التنفيذ الشرطي'
            ]
        },
        {
            title: 'الشابتر الرابع',
            subtitle: 'الدوال والتكرار — Functions & Recursion',
            sections: [
                'الدوال'
            ]
        },
        {
            title: 'الشابتر الخامس',
            subtitle: 'التكرار والحلقات — Iteration & Loops',
            sections: [
                'التكرار'
            ]
        },
        {
            title: 'الشابتر السادس',
            subtitle: 'النصوص — Strings',
            sections: '*'
        }
    ];
    let BAB_GROUPS = [];    // [{ title, subtitle, sectionIndexes: [] }]

    // فهرس الباب الذي يخصّ اسم قسم: الأبواب المحددة أولاً، ثم الملاذ "*"
    function babIndexForSection(name) {
        let catchAll = -1;
        for (let i = 0; i < BABS.length; i++) {
            const s = BABS[i].sections;
            if (s === '*') { if (catchAll === -1) catchAll = i; continue; }
            if (Array.isArray(s) && s.some(p => name.includes(p))) return i;
        }
        return catchAll;
    }

    // الترتيب المطلوب للأقسام حسب تسلسل الدروس
    const SECTION_ORDER = [
        'المتغيرات والتعبيرات والجُمل',   // الشابتر الثاني
        'التنفيذ الشرطي',                 // الشابتر الثالث
        'الدوال (Functions)',            // الشابتر الرابع
        'التكرار (Iteration)',           // الشابتر الخامس
        'النصوص (Strings)'               // الشابتر السادس
    ];

    // رتبة القسم = فهرس أطول عبارة مطابقة (ليقع "مراحل تطور..." بعد "المملكة..." الصرفة)
    function sectionRank(name) {
        let rank = SECTION_ORDER.length, bestLen = -1;
        SECTION_ORDER.forEach((kw, i) => {
            if (name.includes(kw) && kw.length > bestLen) { bestLen = kw.length; rank = i; }
        });
        return rank;
    }

    // إزالة بادئة "القسم الأول:" المكررة لعرض العنوان كما في الصورة
    function displaySectionName(name) {
        return name.replace(/^\s*القسم\s+[^:：\-–]*[:：\-–]\s*/, '').trim() || name;
    }

    const app = document.getElementById('app');

    // ---------- مفتاح الإغلاق ----------
    // يقرأ صفاً واحداً من app_config؛ إن كان enabled=false تُغلق الصفحة.
    // (افتراضياً مفتوحة لو تعذّر الفحص أو لم يوجد المفتاح، تجنّباً لإغلاق غير مقصود)
    async function isPageOpen() {
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/${CONFIG_TABLE}?key=eq.${PAGE_KEY}&select=enabled`,
                { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
            );
            if (res.ok) {
                const rows = await res.json();
                if (Array.isArray(rows) && rows.length && rows[0].enabled === false) return false;
            }
        } catch (_) { /* تجاهل: تبقى مفتوحة */ }
        return true;
    }

    function renderClosed() {
        app.innerHTML = `<div class="state-msg">
            <div style="font-size:3.2rem;margin-bottom:1rem"><i class="fas fa-lock"></i></div>
            الصفحة مغلقة مؤقتاً
            <div><small style="opacity:.85">يرجى المحاولة لاحقاً</small></div>
        </div>`;
    }

    // ---------- تسجيل الزيارة (صامت — لا يظهر شيء للزائر) ----------
    function getVisitorId() {
        try {
            let id = localStorage.getItem('py_visitor');
            if (!id) {
                id = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : (Date.now().toString(36) + Math.random().toString(36).slice(2));
                localStorage.setItem('py_visitor', id);
            }
            return id;
        } catch (_) { return null; }
    }

    // استنتاج الجهاز/النظام/المتصفح من user agent (تقريبي)
    function parseUA(ua) {
        ua = ua || '';
        const device = /iPad|Tablet/i.test(ua) ? 'tablet'
            : /Mobi|Android|iPhone|iPod/i.test(ua) ? 'mobile' : 'desktop';
        let os = 'غير معروف';
        if (/Windows/i.test(ua)) os = 'Windows';
        else if (/Android/i.test(ua)) os = 'Android';
        else if (/iPhone|iPad|iPod/i.test(ua)) os = 'iOS';
        else if (/Mac OS X|Macintosh/i.test(ua)) os = 'macOS';
        else if (/Linux/i.test(ua)) os = 'Linux';
        let browser = 'غير معروف';
        if (/Edg/i.test(ua)) browser = 'Edge';
        else if (/OPR|Opera/i.test(ua)) browser = 'Opera';
        else if (/Chrome|CriOS/i.test(ua)) browser = 'Chrome';
        else if (/Firefox|FxiOS/i.test(ua)) browser = 'Firefox';
        else if (/Safari/i.test(ua)) browser = 'Safari';
        return { device, os, browser };
    }

    function collectMeta() {
        const ua = navigator.userAgent || '';
        const p = parseUA(ua);
        let tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_) {}
        return {
            user_agent: ua,
            language: navigator.language || '',
            screen: (window.screen ? screen.width + 'x' + screen.height : ''),
            timezone: tz,
            referrer: document.referrer || '',
            device: p.device,
            os: p.os,
            browser: p.browser
        };
    }

    function logVisit() {
        try {
            fetch(`${SUPABASE_URL}/rest/v1/rpc/log_visit`, {
                method: 'POST',
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    p_page: PAGE_KEY,
                    p_visitor: getVisitorId(),
                    p_meta: collectMeta()
                }),
                keepalive: true
            }).catch(() => {});
        } catch (_) { /* تجاهل */ }
    }

    // ---------- محلّل CSV ----------
    // يدعم الحقول المقتبسة بين "..."، الفواصل داخل الاقتباس، والاقتباس المزدوج ("")
    // كذلك أسطر CRLF و LF. يُعيد مصفوفة صفوف؛ كل صف مصفوفة حقول نصية.
    function parseCSV(text) {
        const rows = [];
        let row = [], field = '', inQuotes = false;
        // إزالة BOM إن وُجد
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (inQuotes) {
                if (c === '"') {
                    if (text[i + 1] === '"') { field += '"'; i++; }
                    else inQuotes = false;
                } else field += c;
            } else {
                if (c === '"') inQuotes = true;
                else if (c === ',') { row.push(field); field = ''; }
                else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
                else if (c === '\r') { /* تجاهل */ }
                else field += c;
            }
        }
        // آخر حقل/صف إن لم ينتهِ بسطر جديد
        if (field !== '' || row.length) { row.push(field); rows.push(row); }
        return rows;
    }

    // تحويل نص CSV إلى مصفوفة كائنات أسئلة اعتماداً على صف العناوين
    function csvToQuestions(text) {
        const rows = parseCSV(text).filter(r => r.length && r.some(v => v.trim() !== ''));
        if (!rows.length) return [];
        const header = rows[0].map(h => h.trim());
        return rows.slice(1).map(cells => {
            const obj = {};
            header.forEach((key, idx) => { obj[key] = (cells[idx] != null ? cells[idx].trim() : ''); });
            return obj;
        });
    }

    // محاولة تحميل الأسئلة من جدول Supabase — تُرجع مصفوفة عند النجاح أو null عند الفشل/الفراغ
    async function loadFromSupabase() {
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/${QUESTIONS_TABLE}?select=*&order=id.asc`,
                { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
            );
            if (!res.ok) return null;                         // الجدول غير موجود/غير مقروء بعد
            const rows = await res.json();
            return (Array.isArray(rows) && rows.length) ? rows : null;
        } catch (_) { return null; }                         // مشكلة شبكة/CORS => نرجع للـ CSV
    }

    // تحميل الأسئلة من ملف CSV المحلي — تُرجع مصفوفة أو null
    async function loadFromCSV() {
        try {
            const res = await fetch(QUESTIONS_CSV, { cache: 'no-cache' });
            if (!res.ok) return null;
            const rows = csvToQuestions(await res.text());
            return (Array.isArray(rows) && rows.length) ? rows : null;
        } catch (_) { return null; }
    }

    // ---------- تحميل البيانات ----------
    async function loadData() {
        try {
            if (!(await isPageOpen())) { renderClosed(); return; }
            logVisit();   // تسجيل صامت بعد التأكد أن الصفحة مفتوحة

            // المصدر الأساسي: Supabase (إن كان مفعّلاً)، مع رجوع تلقائي لملف CSV المحلي
            let questions = USE_SUPABASE ? await loadFromSupabase() : null;
            if (!questions) questions = await loadFromCSV();

            if (!Array.isArray(questions) || questions.length === 0) {
                app.innerHTML = `<div class="state-msg">
                    <i class="fas fa-circle-info"></i> لم يُعثر على أي أسئلة.<br>
                    <small style="opacity:.85">
                        تأكد من وجود جدول <code>${escapeHtml(QUESTIONS_TABLE)}</code> على Supabase
                        (مع سياسة قراءة عامة)، أو من ملف <code>${escapeHtml(QUESTIONS_CSV)}</code>.
                    </small>
                </div>`;
                return;
            }
            ALL_QUESTIONS = questions;
            groupData();
            if (SHOW_SUMMARIES) await loadSummaries();   // عند الإخفاء تبقى SUMMARIES فارغة فلا تظهر أي بطاقة شرح
            dataReady = true;
            route();   // اعرض حسب عنوان الصفحة الحالي (يدعم زر الرجوع في المتصفح)
        } catch (err) {
            app.innerHTML = `<div class="state-msg">
                <i class="fas fa-triangle-exclamation"></i> تعذّر تحميل الأسئلة.<br>
                <small style="opacity:.85">${escapeHtml(err.message)}</small>
            </div>`;
        }
    }

    // تحميل قائمة الملخصات (اختياري — لا يُفشل الصفحة إن لم تكن موجودة)
    async function loadSummaries() {
        try {
            const res = await fetch('summaries/summaries.json', { cache: 'no-cache' });
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data)) SUMMARIES = data.filter(s => s && s.file);
        } catch (_) { /* لا توجد ملخصات بعد */ }
    }

    // القسم المستهدف لعبارة ملخص: مطابقة كاملة، وإلا أدق مطابقة جزئية (أقصر اسم)
    function summaryTargetSection(phrase) {
        if (!phrase) return null;                       // فارغ => يظهر في كل الأقسام
        const exact = SECTIONS.find(s => s.name === phrase);
        if (exact) return exact.name;
        const matches = SECTIONS.filter(s => s.name.includes(phrase));
        if (matches.length === 0) return undefined;     // لا يطابق أي قسم
        matches.sort((a, b) => a.name.length - b.name.length);
        return matches[0].name;                         // الأدق = الأقصر اسماً
    }

    // ملخصات قسم معيّن
    function summariesForSection(sectionName) {
        return SUMMARIES
            .map((s, idx) => ({ ...s, _idx: idx }))
            .filter(s => {
                const target = summaryTargetSection(s.section);
                return target === null ? true : target === sectionName;
            });
    }

    function groupData() {
        const secMap = new Map();
        ALL_QUESTIONS.forEach(q => {
            const secName = q.section || 'غير مصنّف';
            const subName = q.subsection || 'عام';
            if (!secMap.has(secName)) secMap.set(secName, new Map());
            const subMap = secMap.get(secName);
            if (!subMap.has(subName)) subMap.set(subName, []);
            subMap.get(subName).push(q);
        });
        SECTIONS = [...secMap.entries()].map(([name, subMap]) => {
            const subsections = [...subMap.entries()].map(([sName, qs]) => ({
                name: sName, questions: qs
            }));
            const count = subsections.reduce((s, x) => s + x.questions.length, 0);
            return { name, subsections, count };
        });
        // رتّب الأقسام حسب تسلسل الصورة، مع إبقاء غير المذكورة في نهايتها بترتيبها الطبيعي
        SECTIONS.forEach((s, i) => { s._origIndex = i; });
        SECTIONS.sort((a, b) => {
            const ra = sectionRank(a.name), rb = sectionRank(b.name);
            return ra !== rb ? ra - rb : a._origIndex - b._origIndex;
        });
        // وزّع الأقسام على الأبواب (بالترتيب المُرتَّب أعلاه)
        BAB_GROUPS = BABS.map(b => ({ title: b.title, subtitle: b.subtitle, sectionIndexes: [] }));
        SECTIONS.forEach((sec, i) => {
            const bi = babIndexForSection(sec.name);
            sec._babIndex = bi;
            if (bi >= 0) BAB_GROUPS[bi].sectionIndexes.push(i);
        });
    }

    // ---------- عرض الأبواب ----------
    function renderBabs() {
        const reviewCount = loadReview().length;
        let html = `
            <div class="top-actions">
                <button class="pill-btn" data-activate tabindex="0" role="button"
                    onclick="location.hash='#/review'">
                    <i class="fas fa-flag-checkered"></i> مراجعة الأخطاء${reviewCount ? ` <span class="count-pill">${reviewCount}</span>` : ''}
                </button>
                <button class="pill-btn" data-activate tabindex="0" role="button"
                    onclick="location.hash='#/history'">
                    <i class="fas fa-clock-rotate-left"></i> سجل النتائج
                </button>
            </div>
            <div class="cards-grid">`;
        BAB_GROUPS.forEach((bab, bi) => {
            if (!bab.sectionIndexes.length) return;
            const qCount = bab.sectionIndexes.reduce((s, idx) => s + SECTIONS[idx].count, 0);
            // إن كان للشابتر قسم واحد فقط: افتح اختبار القسم كامل مباشرة (بدون صفحات وسيطة)
            const target = bab.sectionIndexes.length === 1
                ? `#/quiz/${bab.sectionIndexes[0]}/-1`
                : `#/bab/${bi}`;
            html += `
                <div class="subject-card bab-card" data-activate tabindex="0" role="button"
                    aria-label="${escapeHtml(bab.title)}" onclick="location.hash='${target}'">
                    <div class="card-badge bab-badge"><i class="fas fa-book-bookmark"></i> شابتر</div>
                    <div class="card-title">${escapeHtml(bab.title)}</div>
                    ${bab.subtitle ? `<p class="card-subtitle">${escapeHtml(bab.subtitle)}</p>` : ''}
                    <div class="card-meta">
                        <i class="fas fa-circle-question"></i>
                        <span>${qCount} سؤال</span>
                    </div>
                </div>`;
        });
        html += `</div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // ---------- عرض الأقسام داخل باب ----------
    function renderSections(babIndex) {
        const bab = BAB_GROUPS[babIndex];
        if (!bab) return renderBabs();
        let html = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='#/'">
                <i class="fas fa-arrow-right"></i> رجوع للشباتر
            </a>
            <div class="header" style="margin-bottom:1.5rem">
                <h1 style="font-size:1.7rem"><i class="fas fa-book-bookmark"></i> ${escapeHtml(bab.title)}</h1>
            </div>
            <div class="cards-grid">`;
        bab.sectionIndexes.forEach((secIdx, i) => {
            const sec = SECTIONS[secIdx];
            html += `
                <div class="subject-card" data-activate tabindex="0" role="button"
                    aria-label="${escapeHtml(displaySectionName(sec.name))}" onclick="location.hash='#/sec/${secIdx}'">
                    <div class="card-badge">القسم ${i + 1}</div>
                    <div class="card-title">${escapeHtml(displaySectionName(sec.name))}</div>
                    <div class="card-meta">
                        <i class="fas fa-layer-group"></i>
                        <span>${sec.subsections.length} مواضيع</span>
                        <span style="margin-inline-start:auto">
                            <i class="fas fa-circle-question"></i> ${sec.count} سؤال
                        </span>
                    </div>
                </div>`;
        });
        html += `</div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // ---------- عرض المواضيع ----------
    function renderSubsections(secIndex) {
        const sec = SECTIONS[secIndex];
        if (!sec) return renderBabs();
        const progress = loadProgress();
        let html = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='#/bab/${sec._babIndex}'">
                <i class="fas fa-arrow-right"></i> رجوع للأقسام
            </a>
            <div class="header" style="margin-bottom:1.5rem">
                <h1 style="font-size:1.6rem">${escapeHtml(displaySectionName(sec.name))}</h1>
            </div>
            <div class="cards-grid">`;

        // بطاقة اختبار كامل القسم — تظهر فقط عند وجود أكثر من موضوع (وإلا فهي تكرار للموضوع الوحيد)
        if (sec.subsections.length > 1) {
            const allKey = sec.name + '::*ALL*';
            html += `
                <div class="subject-card" data-activate tabindex="0" role="button"
                    aria-label="اختبار كامل القسم" onclick="location.hash='#/quiz/${secIndex}/-1'" style="background:#f4f8f6">
                    <div class="card-badge"><i class="fas fa-list-check"></i> شامل</div>
                    <div class="card-title">اختبار كامل القسم</div>
                    <div class="card-meta">
                        <i class="fas fa-circle-question"></i>
                        <span>${sec.count} سؤال من كل المواضيع</span>
                        ${savedBadge(progress[allKey])}
                    </div>
                </div>`;
        }

        // بطاقات الملخصات الخاصة بهذا القسم
        summariesForSection(sec.name).forEach(sm => {
            html += `
                <div class="subject-card summary-card" data-activate tabindex="0" role="button"
                    aria-label="${escapeHtml(sm.title || 'ملخص')}" onclick="location.hash='#/summary/${sm._idx}/${secIndex}'">
                    <div class="card-badge summary-badge"><i class="fas fa-book-open"></i> ملخص</div>
                    <div class="card-title">${escapeHtml(sm.title || 'ملخص')}</div>
                    <div class="card-meta">
                        <i class="fas fa-file-lines"></i>
                        <span>اضغط للقراءة</span>
                    </div>
                </div>`;
        });

        sec.subsections.forEach((sub, j) => {
            const subKey = sec.name + '::' + sub.name;
            html += `
                <div class="subject-card" data-activate tabindex="0" role="button"
                    aria-label="${escapeHtml(sub.name)}" onclick="location.hash='#/quiz/${secIndex}/${j}'">
                    <div class="card-badge">موضوع ${j + 1}</div>
                    <div class="card-title">${escapeHtml(sub.name)}</div>
                    <div class="card-meta">
                        <i class="fas fa-circle-question"></i>
                        <span>${sub.questions.length} سؤال</span>
                        ${savedBadge(progress[subKey])}
                    </div>
                </div>`;
        });
        html += `</div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // شارة صغيرة تُظهر أن هناك تقدّماً محفوظاً لهذا الاختبار
    function savedBadge(rec) {
        if (!rec || !rec.answers) return '';
        const n = Object.keys(rec.answers).length;
        if (!n) return '';
        const label = rec.checked ? 'مكتمل' : `${n} محفوظة`;
        return `<span style="margin-inline-start:auto;color:#b98a00">
            <i class="fas fa-floppy-disk"></i> ${label}</span>`;
    }

    // ---------- قارئ الملخص ----------
    async function renderSummaryReader(summaryIndex, secIndex) {
        const sm = SUMMARIES[summaryIndex];
        if (!sm) return renderBabs();
        app.innerHTML = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='#/sec/${secIndex}'">
                <i class="fas fa-arrow-right"></i> رجوع للمواضيع
            </a>
            <div class="panel md-content" id="md-view">
                <p class="text-center" style="color:var(--primary-color)">
                    <i class="fas fa-spinner fa-spin"></i> جاري تحميل الملخص...
                </p>
            </div>`;
        window.scrollTo(0, 0);
        const view = document.getElementById('md-view');
        try {
            const res = await fetch(sm.file, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();
            if (window.marked && typeof marked.parse === 'function') {
                view.innerHTML = marked.parse(text);
            } else {
                // احتياط لو تعذّر تحميل مكتبة marked
                view.innerHTML = '<pre style="white-space:pre-wrap">' + escapeHtml(text) + '</pre>';
            }
        } catch (err) {
            view.innerHTML = `<p class="text-danger">
                <i class="fas fa-triangle-exclamation"></i>
                تعذّر تحميل الملف: <code>${escapeHtml(sm.file)}</code> (${escapeHtml(err.message)})
            </p>`;
        }
    }

    // ---------- سجل النتائج ----------
    function renderHistory() {
        const h = loadHistory();
        let html = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='#/'">
                <i class="fas fa-arrow-right"></i> رجوع
            </a>
            <div class="header" style="margin-bottom:1.2rem">
                <h1 style="font-size:1.6rem"><i class="fas fa-clock-rotate-left"></i> سجل النتائج</h1>
            </div>`;
        if (!h.length) {
            html += `<div class="panel" style="text-align:center;color:#666">
                لا توجد محاولات محفوظة بعد. أكمِل اختباراً واضغط «تحقّق من الإجابات» ليظهر هنا.
            </div>`;
            app.innerHTML = html;
            window.scrollTo(0, 0);
            return;
        }
        html += `<div class="panel">
            <div style="text-align:left;margin-bottom:0.8rem">
                <button class="link-btn" onclick="clearHistory()"><i class="fas fa-trash"></i> مسح السجل</button>
            </div>
            <div class="history-list">`;
        h.forEach(rec => {
            const pct = rec.total ? Math.round(rec.correct / rec.total * 100) : 0;
            const cls = pct >= 80 ? 'grade-pass' : pct >= 60 ? 'grade-mid' : 'grade-fail';
            let ds;
            try { ds = new Date(rec.t).toLocaleString('ar'); }
            catch (_) { ds = new Date(rec.t).toLocaleString(); }
            html += `<div class="history-row">
                <div class="hr-title">${escapeHtml(rec.title || 'اختبار')}</div>
                <div class="hr-meta">
                    <span class="hr-score ${cls}">${rec.correct}/${rec.total} (${pct}%)</span>
                    <span class="hr-date">${escapeHtml(ds)}</span>
                </div>
            </div>`;
        });
        html += `</div></div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    function clearHistory() {
        if (confirm('مسح كل سجل النتائج؟')) { saveHistory([]); renderHistory(); }
    }

    // ---------- قسم مراجعة الأخطاء ----------
    // يجمع كل سؤال أُجيب خطأً بعد «تحقّق من الإجابات»؛ ما يُجاب صحيحاً لاحقاً يخرج تلقائياً.
    function renderReview() {
        const bank = loadReview();
        const backLink = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='#/'">
                <i class="fas fa-arrow-right"></i> رجوع
            </a>`;
        if (!bank.length) {
            app.innerHTML = backLink + `
                <div class="header" style="margin-bottom:1.2rem">
                    <h1 style="font-size:1.6rem"><i class="fas fa-flag-checkered"></i> مراجعة الأخطاء</h1>
                </div>
                <div class="panel" style="text-align:center;color:#666">
                    لا توجد أخطاء للمراجعة حالياً. أي سؤال تُجيبه خطأً بعد «تحقّق من الإجابات» يظهر هنا تلقائياً.
                </div>`;
            window.scrollTo(0, 0);
            return;
        }

        isReviewMode = true;
        currentQuestions = shuffleMode ? shuffled(bank) : bank.slice();
        optionOrders = {};
        currentQuestions.forEach(q => {
            const keys = OPTION_KEYS.filter(k => q['option_' + k] != null && q['option_' + k] !== '');
            optionOrders[q.id] = shuffleMode ? shuffled(keys) : keys;
        });
        currentSecIndex = -1;
        currentSubIndex = -1;
        currentQuizKey = '*REVIEW*';
        currentQuizTitle = 'مراجعة الأخطاء';
        userAnswers = {};
        quizChecked = false;
        reviewWrongOnly = false;

        app.innerHTML = backLink + `
            <div class="quiz-progress">
                <i class="fas fa-flag-checkered"></i> مراجعة الأخطاء &mdash; ${currentQuestions.length} سؤال
            </div>
            <div class="saved-note">
                <i class="fas fa-circle-info"></i>
                هذه أسئلة أخطأت فيها سابقاً. أجب من جديد واضغط «تحقّق»، وسنُزيل ما تُجيبه صحيحاً من قائمة المراجعة.
            </div>
            <div class="quiz-toggles">
                <label class="instant-toggle">
                    <input type="checkbox" id="instant-mode" ${instantMode ? 'checked' : ''}
                        onchange="setInstantMode(this.checked)">
                    <span class="switch"></span>
                    <span><i class="fas fa-bolt"></i> التصحيح الفوري</span>
                </label>
            </div>
            <div class="quiz-progressbar" id="qp-bar">
                <div class="qp-track"><div class="qp-fill" id="qp-fill"></div></div>
                <div class="qp-meta">
                    <span><i class="fas fa-list-check"></i> <span id="qp-text">0 / ${currentQuestions.length}</span></span>
                    <button class="link-btn" onclick="jumpToUnanswered()">
                        <i class="fas fa-forward"></i> أول سؤال غير مُجاب
                    </button>
                </div>
            </div>
            <div id="results" class="results"></div>
            <div id="questions-list"></div>
            <div class="quiz-controls">
                <button class="quiz-btn check" onclick="checkAnswers()">
                    <i class="fas fa-check"></i> تحقّق من الإجابات
                </button>
                <button class="quiz-btn reset" onclick="resetQuiz()">
                    <i class="fas fa-rotate-right"></i> إعادة
                </button>
            </div>`;
        renderQuestions();
        document.getElementById('questions-list').addEventListener('keydown', quizKeyHandler);
        window.scrollTo(0, 0);
    }

    // ---------- الاختبار ----------
    let currentQuestions = [];      // بترتيب العرض (قد يكون عشوائياً)
    let optionOrders = {};          // qid -> ترتيب مفاتيح الخيارات المعروضة
    let userAnswers = {};           // qid -> مفتاح الخيار
    let currentSecIndex = -1, currentSubIndex = -1;
    let currentQuizKey = '', currentQuizTitle = '';
    let quizChecked = false;        // هل احتُسبت النتيجة؟
    let reviewWrongOnly = false;    // عرض الأخطاء فقط
    let isReviewMode = false;       // نحن داخل قسم «مراجعة الأخطاء»
    let instantMode = (loadPrefs().instant === true);
    let shuffleMode = (loadPrefs().shuffle === true);

    // تهيئة حالة اختبار: ترتيب الأسئلة/الخيارات واستعادة الإجابات المحفوظة
    function initQuizState(secIndex, subIndex) {
        const sec = SECTIONS[secIndex];
        const base = subIndex === -1
            ? sec.subsections.flatMap(s => s.questions)
            : sec.subsections[subIndex].questions;

        currentQuestions = shuffleMode ? shuffled(base) : base.slice();
        optionOrders = {};
        currentQuestions.forEach(q => {
            const keys = OPTION_KEYS.filter(k => q['option_' + k] != null && q['option_' + k] !== '');
            optionOrders[q.id] = shuffleMode ? shuffled(keys) : keys;
        });

        currentSecIndex = secIndex;
        currentSubIndex = subIndex;
        currentQuizKey = sec.name + '::' + (subIndex === -1 ? '*ALL*' : sec.subsections[subIndex].name);
        currentQuizTitle = subIndex === -1
            ? 'اختبار كامل القسم — ' + displaySectionName(sec.name)
            : sec.subsections[subIndex].name;

        const saved = loadProgress()[currentQuizKey];
        userAnswers = (saved && saved.answers) ? { ...saved.answers } : {};
        quizChecked = !!(saved && saved.checked);
        reviewWrongOnly = false;
        isReviewMode = false;
    }

    function persistCurrent() {
        const all = loadProgress();
        all[currentQuizKey] = {
            answers: userAnswers, checked: quizChecked,
            title: currentQuizTitle, t: Date.now()
        };
        saveProgress(all);
    }

    function setInstantMode(on) {
        instantMode = on;
        const pr = loadPrefs(); pr.instant = on; savePrefs(pr);
        renderQuestions();
        const box = document.getElementById('results');
        if (box) box.style.display = 'none';
    }

    function setShuffleMode(on) {
        shuffleMode = on;
        const pr = loadPrefs(); pr.shuffle = on; savePrefs(pr);
        // أعِد ترتيب الأسئلة/الخيارات مع الحفاظ على الإجابات المحفوظة
        initQuizState(currentSecIndex, currentSubIndex);
        renderQuestions();
        const box = document.getElementById('results');
        if (box) box.style.display = 'none';
    }

    function startQuiz(secIndex, subIndex) {
        if (!SECTIONS[secIndex]) return renderBabs();
        // تحقّق من صحّة رقم الموضوع
        if (subIndex !== -1 && !SECTIONS[secIndex].subsections[subIndex]) return renderSubsections(secIndex);

        initQuizState(secIndex, subIndex);
        const saved = loadProgress()[currentQuizKey];
        const hasSaved = saved && saved.answers && Object.keys(saved.answers).length;

        // اختبار القسم كامل (subIndex = -1) يرجع للشباتر مباشرة؛ اختبار موضوع يرجع لصفحة المواضيع
        const backTarget = subIndex === -1 ? '#/' : `#/sec/${secIndex}`;
        const backLabel  = subIndex === -1 ? 'رجوع للشباتر' : 'رجوع للمواضيع';
        let html = `
            <a class="back-btn" data-activate tabindex="0" role="button" onclick="location.hash='${backTarget}'">
                <i class="fas fa-arrow-right"></i> ${backLabel}
            </a>`;
        html += `
            <div class="quiz-progress">
                <i class="fas fa-pen-to-square"></i> ${escapeHtml(currentQuizTitle)}
                &mdash; ${currentQuestions.length} سؤال
            </div>
            <div class="quiz-toggles">
                <label class="instant-toggle">
                    <input type="checkbox" id="instant-mode" ${instantMode ? 'checked' : ''}
                        onchange="setInstantMode(this.checked)">
                    <span class="switch"></span>
                    <span><i class="fas fa-bolt"></i> التصحيح الفوري</span>
                </label>
                <label class="instant-toggle">
                    <input type="checkbox" id="shuffle-mode" ${shuffleMode ? 'checked' : ''}
                        onchange="setShuffleMode(this.checked)">
                    <span class="switch"></span>
                    <span><i class="fas fa-shuffle"></i> ترتيب عشوائي</span>
                </label>
            </div>
            ${hasSaved ? `<div class="saved-note">
                <i class="fas fa-floppy-disk"></i> تمّت استعادة إجاباتك المحفوظة.
                <button class="link-btn" onclick="resetQuiz()">ابدأ من جديد</button>
            </div>` : ''}
            <div class="quiz-progressbar" id="qp-bar">
                <div class="qp-track"><div class="qp-fill" id="qp-fill"></div></div>
                <div class="qp-meta">
                    <span><i class="fas fa-list-check"></i> <span id="qp-text">0 / ${currentQuestions.length}</span></span>
                    <button class="link-btn" onclick="jumpToUnanswered()">
                        <i class="fas fa-forward"></i> أول سؤال غير مُجاب
                    </button>
                </div>
            </div>
            <div id="results" class="results"></div>
            <div id="questions-list"></div>
            <div class="quiz-controls">
                <button class="quiz-btn check" onclick="checkAnswers()">
                    <i class="fas fa-check"></i> تحقّق من الإجابات
                </button>
                <button class="quiz-btn reset" onclick="resetQuiz()">
                    <i class="fas fa-rotate-right"></i> إعادة
                </button>
            </div>`;
        app.innerHTML = html;
        renderQuestions();

        // اختيار الإجابة بمفاتيح A/B/C/D أو 1/2/3/4 (إتاحة الوصول)
        document.getElementById('questions-list').addEventListener('keydown', quizKeyHandler);

        window.scrollTo(0, 0);

        // إن كان الاختبار محفوظاً كمكتمل، أعِد إظهار النتيجة
        if (quizChecked) {
            const correct = currentQuestions.filter(q =>
                userAnswers[q.id] === (q.correct_option || '').toLowerCase()).length;
            showResults(correct, currentQuestions.length);
        }
    }

    // صياغة نص السؤال: السطر الأول نص/سؤال، وأي أسطر تالية تُعرض ككتلة كود (LTR أحادي المسافة)
    function formatQuestionText(raw) {
        const text = String(raw == null ? '' : raw).replace(/\r/g, '');
        const nl = text.indexOf('\n');
        if (nl === -1) return `<span class="q-prompt">${escapeHtml(text)}</span>`;
        const prompt = text.slice(0, nl).trimEnd();
        const code = text.slice(nl + 1).replace(/\s+$/, '');
        return `<span class="q-prompt">${escapeHtml(prompt)}</span>` +
               `<code class="code-block">${escapeHtml(code)}</code>`;
    }

    function renderQuestions() {
        const list = document.getElementById('questions-list');
        let html = '';
        currentQuestions.forEach((q, qi) => {
            html += `<div class="quiz-question" data-q="${qi}" role="radiogroup"
                aria-label="${escapeHtml('سؤال ' + (qi + 1))}">
                <div class="q-text"><span class="q-num">${qi + 1}.</span> ${formatQuestionText(q.question)}</div>`;
            (optionOrders[q.id] || OPTION_KEYS).forEach(key => {
                const text = q['option_' + key];
                if (text == null || text === '') return;
                html += `
                    <div class="quiz-option" data-opt="${key}" role="radio" aria-checked="false"
                        tabindex="0" data-activate onclick="selectOption(${qi}, '${key}')">
                        <span class="opt-letter">${key.toUpperCase()}</span>
                        <span>${escapeHtml(text)}</span>
                    </div>`;
            });
            const exp = q.correct_text || '';
            html += `<div class="explanation" data-exp="${qi}">
                <i class="fas fa-circle-info"></i> الإجابة الصحيحة:
                <strong>${escapeHtml((q.correct_option || '').toUpperCase())}</strong>
                ${exp ? '&mdash; ' + escapeHtml(exp) : ''}
            </div>`;
            html += `</div>`;
        });
        list.innerHTML = html;

        // إعادة تطبيق الإجابات المحفوظة/المختارة + التلوين إن لزم
        currentQuestions.forEach((q, qi) => {
            const userKey = userAnswers[q.id];
            const qDiv = list.querySelector(`.quiz-question[data-q="${qi}"]`);
            if (userKey !== undefined) {
                const sel = qDiv.querySelector(`.quiz-option[data-opt="${userKey}"]`);
                if (sel) { sel.classList.add('selected'); sel.setAttribute('aria-checked', 'true'); }
            }
            // بعد احتساب النتيجة نُظهر التصحيح؛ أما التصحيح الفوري فيظهر عند الإجابة فقط
            if (quizChecked) markQuestion(qi);
        });

        updateProgressBar();
        applyReviewFilter();
    }

    function selectOption(qi, key) {
        const q = currentQuestions[qi];
        const qDiv = document.querySelector(`.quiz-question[data-q="${qi}"]`);
        // بعد التصحيح الفوري أو احتساب النتيجة: لا يُسمح بتغيير الإجابة
        if ((instantMode || quizChecked) && userAnswers[q.id] !== undefined) return;

        userAnswers[q.id] = key;
        qDiv.querySelectorAll('.quiz-option').forEach(o => {
            o.classList.remove('selected'); o.setAttribute('aria-checked', 'false');
        });
        const optEl = qDiv.querySelector(`.quiz-option[data-opt="${key}"]`);
        optEl.classList.add('selected'); optEl.setAttribute('aria-checked', 'true');

        if (instantMode) markQuestion(qi);
        persistCurrent();
        updateProgressBar();
    }

    // اختيار الخيار عبر لوحة المفاتيح داخل قائمة الأسئلة
    function quizKeyHandler(e) {
        const qEl = e.target.closest('.quiz-question');
        if (!qEl) return;
        const key = (e.key || '').toLowerCase();
        let sel = null;
        if (['a', 'b', 'c', 'd'].includes(key)) sel = key;
        else if (['1', '2', '3', '4'].includes(key)) sel = OPTION_KEYS[+key - 1];
        if (sel) {
            const opt = qEl.querySelector(`.quiz-option[data-opt="${sel}"]`);
            if (opt) { e.preventDefault(); opt.click(); opt.focus(); }
        }
    }

    // تلوين سؤال واحد بالصحيح/الخطأ + إظهار الشرح
    function markQuestion(qi) {
        const q = currentQuestions[qi];
        const qDiv = document.querySelector(`.quiz-question[data-q="${qi}"]`);
        if (!qDiv) return;
        const userKey = userAnswers[q.id];
        const correctKey = (q.correct_option || '').toLowerCase();

        qDiv.classList.add('answered');
        qDiv.querySelectorAll('.quiz-option').forEach(o => {
            o.classList.remove('correct', 'incorrect');
            const k = o.getAttribute('data-opt');
            if (k === correctKey) o.classList.add('correct');
            if (k === userKey && userKey !== correctKey) o.classList.add('incorrect');
        });
        const expDiv = qDiv.querySelector('.explanation');
        if (expDiv) expDiv.classList.add('show');
    }

    // تحديث شريط التقدّم (عدد المُجاب / الكل)
    function updateProgressBar() {
        const total = currentQuestions.length;
        const answered = currentQuestions.filter(q => userAnswers[q.id] !== undefined).length;
        const fill = document.getElementById('qp-fill');
        const txt = document.getElementById('qp-text');
        if (fill) fill.style.width = (total ? (answered / total) * 100 : 0) + '%';
        if (txt) txt.textContent = `${answered} / ${total}`;
    }

    // الانتقال لأول سؤال غير مُجاب
    function jumpToUnanswered() {
        const idx = currentQuestions.findIndex(q => userAnswers[q.id] === undefined);
        if (idx === -1) return;
        const el = document.querySelector(`.quiz-question[data-q="${idx}"]`);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const opt = el.querySelector('.quiz-option');
            if (opt) opt.focus();
        }
    }

    function checkAnswers() {
        const unanswered = currentQuestions.filter(q => userAnswers[q.id] === undefined).length;
        if (unanswered > 0 &&
            !confirm(`لديك ${unanswered} سؤالاً غير مُجاب سيُحتسب خطأً. هل تريد احتساب النتيجة الآن؟`)) {
            return;
        }
        let correct = 0;
        currentQuestions.forEach((q, qi) => {
            markQuestion(qi);
            const isCorrect = userAnswers[q.id] === (q.correct_option || '').toLowerCase();
            if (isCorrect) {
                correct++;
                removeFromReview(q.id);                 // أُجيب صحيحاً => يخرج من المراجعة
            } else if (userAnswers[q.id] !== undefined && !isReviewMode) {
                addWrongToReview(q, q.subsection || currentQuizTitle);  // أُجيب خطأً => للمراجعة
            }
        });
        quizChecked = true;
        persistCurrent();
        if (!isReviewMode) addHistory(correct, currentQuestions.length);
        showResults(correct, currentQuestions.length);
    }

    function addHistory(correct, total) {
        const h = loadHistory();
        h.unshift({ t: Date.now(), key: currentQuizKey, title: currentQuizTitle, correct, total });
        saveHistory(h.slice(0, 50));
    }

    function showResults(correct, total) {
        const pct = total ? (correct / total) * 100 : 0;
        let cls, msg;
        if (pct >= 80)      { cls = 'grade-pass'; msg = 'ممتاز!'; }
        else if (pct >= 60) { cls = 'grade-mid';  msg = 'جيد'; }
        else                { cls = 'grade-fail'; msg = 'يحتاج مراجعة'; }
        const wrong = total - correct;

        const box = document.getElementById('results');
        box.innerHTML = `
            <div class="score">${correct} / ${total}</div>
            <div class="grade ${cls}">${msg} (${Math.round(pct)}%)</div>
            <div class="res-breakdown">
                <span class="rb ok"><i class="fas fa-check"></i> صحيحة: ${correct}</span>
                <span class="rb bad"><i class="fas fa-xmark"></i> خاطئة: ${wrong}</span>
            </div>
            ${wrong > 0 ? `<div class="res-actions">
                <button class="chip ${reviewWrongOnly ? 'active' : ''}" id="rw-btn" data-activate tabindex="0"
                    onclick="toggleReview(true)"><i class="fas fa-filter"></i> راجع الأخطاء فقط</button>
                <button class="chip ${!reviewWrongOnly ? 'active' : ''}" id="all-btn" data-activate tabindex="0"
                    onclick="toggleReview(false)"><i class="fas fa-list"></i> أظهر الكل</button>
            </div>` : ''}`;
        box.style.display = 'block';
        box.scrollIntoView({ behavior: 'smooth' });
    }

    // إظهار/إخفاء الأسئلة الصحيحة عند مراجعة الأخطاء
    function applyReviewFilter() {
        currentQuestions.forEach((q, qi) => {
            const el = document.querySelector(`.quiz-question[data-q="${qi}"]`);
            if (!el) return;
            if (reviewWrongOnly && quizChecked) {
                const isWrong = userAnswers[q.id] !== (q.correct_option || '').toLowerCase();
                el.style.display = isWrong ? '' : 'none';
            } else {
                el.style.display = '';
            }
        });
    }

    function toggleReview(on) {
        reviewWrongOnly = on;
        applyReviewFilter();
        const rw = document.getElementById('rw-btn'), al = document.getElementById('all-btn');
        if (rw) rw.classList.toggle('active', on);
        if (al) al.classList.toggle('active', !on);
        const list = document.getElementById('questions-list');
        if (list) list.scrollIntoView({ behavior: 'smooth' });
    }

    function resetQuiz() {
        // في وضع المراجعة: أعِد المحاولة على نفس مجموعة الأخطاء الحالية دون لمس البنك
        if (isReviewMode) {
            userAnswers = {};
            quizChecked = false;
            reviewWrongOnly = false;
            renderQuestions();
            const rb = document.getElementById('results');
            if (rb) rb.style.display = 'none';
            window.scrollTo(0, 0);
            return;
        }
        // امسح التقدّم المحفوظ لهذا الاختبار وابدأ من جديد (بترتيب جديد إن كان عشوائياً)
        const all = loadProgress();
        delete all[currentQuizKey];
        saveProgress(all);
        initQuizState(currentSecIndex, currentSubIndex);
        userAnswers = {};
        quizChecked = false;
        reviewWrongOnly = false;
        renderQuestions();
        const box = document.getElementById('results');
        if (box) box.style.display = 'none';
        window.scrollTo(0, 0);
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ---------- التوجيه (routing) بعنوان الصفحة #hash ----------
    // يتيح استخدام زر الرجوع/التقدّم في المتصفح ومشاركة الروابط المباشرة.
    function route() {
        if (!dataReady) return;
        const raw = (location.hash || '').replace(/^#\/?/, '');
        const p = raw.split('/').filter(Boolean);
        const n = p.slice(1).map(Number);
        try {
            switch (p[0]) {
                case undefined: renderBabs(); break;
                case 'bab':     renderSections(n[0]); break;
                case 'sec':     renderSubsections(n[0]); break;
                case 'quiz':    startQuiz(n[0], n[1]); break;
                case 'summary': renderSummaryReader(n[0], n[1]); break;
                case 'history': renderHistory(); break;
                case 'review':  renderReview(); break;
                default:        renderBabs();
            }
        } catch (e) { renderBabs(); }
    }
    window.addEventListener('hashchange', route);

    // تفعيل البطاقات/الأزرار بلوحة المفاتيح (Enter/Space) — إتاحة الوصول
    app.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const t = e.target.closest('[data-activate]');
        if (t) { e.preventDefault(); t.click(); }
    });

    document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
