<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العلوم العسكرية - بنك الأسئلة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #295340;
            --primary-dark: #1a3d2e;
            --secondary-color: #dddcea;
            --dark-bg: #222222;
        }

        * { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-bg) 100%);
            min-height: 100vh;
            padding: 2rem 0;
            direction: rtl;
        }

        .container { max-width: 1100px; }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2.5rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle { font-size: 1.15rem; opacity: 0.9; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.3rem;
            background: rgba(255,255,255,0.15);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.25s;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .back-btn:hover { background: rgba(255,255,255,0.28); color: white; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .subject-card {
            background: white;
            border-radius: 15px;
            padding: 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .subject-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }
        .subject-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 0.4rem 1.1rem;
            border-radius: 25px;
            font-weight: 600;
            margin-bottom: 0.9rem;
            font-size: 0.85rem;
        }
        .card-title {
            color: var(--dark-bg);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            line-height: 1.5;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            font-size: 0.9rem;
            padding-top: 0.9rem;
            border-top: 1px solid #eee;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .loading, .state-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: white;
            font-size: 1.15rem;
        }

        /* Quiz */
        .quiz-progress {
            color: white;
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }
        .quiz-question {
            background: white;
            border-radius: 12px;
            padding: 1.3rem 1.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
        }
        .q-text {
            font-weight: 700;
            color: var(--dark-bg);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            line-height: 1.7;
        }
        .q-num {
            color: var(--primary-color);
            font-weight: 700;
        }
        .quiz-option {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.75rem 1rem;
            margin: 0.5rem 0;
            border: 2px solid #e6e6e6;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .quiz-option:hover { border-color: var(--primary-color); background: #f4f8f6; }
        .quiz-option.selected { border-color: var(--primary-color); background: #e8f1ec; }
        .quiz-option.correct { border-color: #1e7e34; background: #d4edda; }
        .quiz-option.incorrect { border-color: #c82333; background: #f8d7da; }
        .quiz-option .opt-letter {
            flex: 0 0 auto;
            width: 28px; height: 28px;
            display: inline-flex;
            align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--secondary-color);
            color: var(--primary-dark);
            font-weight: 700;
            font-size: 0.85rem;
        }
        .quiz-option.correct .opt-letter { background: #1e7e34; color: white; }
        .quiz-option.incorrect .opt-letter { background: #c82333; color: white; }

        .explanation {
            margin-top: 0.8rem;
            padding: 0.7rem 1rem;
            background: #f4f8f6;
            border-right: 4px solid var(--primary-color);
            border-radius: 6px;
            color: #333;
            font-size: 0.95rem;
            display: none;
        }
        .explanation.show { display: block; }

        .quiz-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }
        .quiz-btn {
            flex: 1 1 auto;
            min-width: 160px;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s;
            color: white;
        }
        .quiz-btn.check { background: var(--primary-color); }
        .quiz-btn.check:hover { background: var(--primary-dark); }
        .quiz-btn.reset { background: #6c757d; }
        .quiz-btn.reset:hover { background: #565e64; }

        .results {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 1.8rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 1.5rem;
        }
        .results .score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        .results .grade { font-size: 1.3rem; font-weight: 700; }
        .grade-pass { color: #1e7e34; }
        .grade-mid { color: #d39e00; }
        .grade-fail { color: #c82333; }

        @media (max-width: 768px) {
            body { padding: 1rem 0; }
            .header h1 { font-size: 1.7rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .quiz-btn { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-shield-halved"></i> العلوم العسكرية</h1>
            <p class="subtitle">بنك الأسئلة — تدرّب حسب القسم والموضوع</p>
        </div>

        <div id="app">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> جاري تحميل الأسئلة...
            </div>
        </div>
    </div>

    <script>
    // ===== إعدادات Supabase =====
    const SUPABASE_URL = 'https://nytuekgasognqvzxemsh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DssZGrSuDi2u9sqTBvtI9A_r1INTSwW';
    const TABLE = 'questions';

    const OPTION_KEYS = ['a', 'b', 'c', 'd'];
    let ALL_QUESTIONS = [];
    let SECTIONS = [];      // [{ name, subsections: [{name, questions:[]}], count }]

    const app = document.getElementById('app');

    // ---------- تحميل البيانات ----------
    async function loadData() {
        try {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc`,
                { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
            );
            const body = await res.text();
            if (!res.ok) {
                app.innerHTML = `<div class="state-msg">
                    <i class="fas fa-triangle-exclamation"></i> فشل الطلب من Supabase (HTTP ${res.status}).<br>
                    <small style="opacity:.85;word-break:break-word">${escapeHtml(body).slice(0, 300)}</small>
                </div>`;
                return;
            }
            ALL_QUESTIONS = JSON.parse(body);
            if (!Array.isArray(ALL_QUESTIONS) || ALL_QUESTIONS.length === 0) {
                app.innerHTML = `<div class="state-msg">
                    <i class="fas fa-circle-info"></i> تم الاتصال بنجاح لكن لم تُرجَع أي أسئلة (0 صف).<br>
                    <small style="opacity:.85">
                        غالباً بسبب Row Level Security: الجدول مفعّل عليه RLS بدون سياسة قراءة عامة،
                        لذا يمنع القراءة عبر المفتاح العام. فعّل سياسة SELECT للعموم على جدول
                        <code>${TABLE}</code>.
                    </small>
                </div>`;
                return;
            }
            groupData();
            renderSections();
        } catch (err) {
            app.innerHTML = `<div class="state-msg">
                <i class="fas fa-triangle-exclamation"></i> تعذّر الاتصال بـ Supabase (مشكلة شبكة أو CORS).<br>
                <small style="opacity:.85">${escapeHtml(err.message)}</small>
            </div>`;
        }
    }

    function groupData() {
        const secMap = new Map();
        ALL_QUESTIONS.forEach(q => {
            const secName = q.section || 'غير مصنّف';
            const subName = q.subsection || 'عام';
            if (!secMap.has(secName)) secMap.set(secName, new Map());
            const subMap = secMap.get(secName);
            if (!subMap.has(subName)) subMap.set(subName, []);
            subMap.get(subName).push(q);
        });
        SECTIONS = [...secMap.entries()].map(([name, subMap]) => {
            const subsections = [...subMap.entries()].map(([sName, qs]) => ({
                name: sName, questions: qs
            }));
            const count = subsections.reduce((s, x) => s + x.questions.length, 0);
            return { name, subsections, count };
        });
    }

    // ---------- عرض الأقسام ----------
    function renderSections() {
        let html = `<div class="cards-grid">`;
        SECTIONS.forEach((sec, i) => {
            html += `
                <div class="subject-card" onclick="renderSubsections(${i})">
                    <div class="card-badge">القسم ${i + 1}</div>
                    <div class="card-title">${escapeHtml(sec.name)}</div>
                    <div class="card-meta">
                        <i class="fas fa-layer-group"></i>
                        <span>${sec.subsections.length} مواضيع</span>
                        <span style="margin-inline-start:auto">
                            <i class="fas fa-circle-question"></i> ${sec.count} سؤال
                        </span>
                    </div>
                </div>`;
        });
        html += `</div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // ---------- عرض المواضيع ----------
    function renderSubsections(secIndex) {
        const sec = SECTIONS[secIndex];
        let html = `
            <a class="back-btn" onclick="renderSections()">
                <i class="fas fa-arrow-right"></i> رجوع للأقسام
            </a>
            <div class="header" style="margin-bottom:1.5rem">
                <h1 style="font-size:1.6rem">${escapeHtml(sec.name)}</h1>
            </div>
            <div class="cards-grid">`;

        // بطاقة اختبار كامل القسم
        html += `
            <div class="subject-card" onclick="startQuiz(${secIndex}, -1)" style="background:#f4f8f6">
                <div class="card-badge"><i class="fas fa-list-check"></i> شامل</div>
                <div class="card-title">اختبار كامل القسم</div>
                <div class="card-meta">
                    <i class="fas fa-circle-question"></i>
                    <span>${sec.count} سؤال من كل المواضيع</span>
                </div>
            </div>`;

        sec.subsections.forEach((sub, j) => {
            html += `
                <div class="subject-card" onclick="startQuiz(${secIndex}, ${j})">
                    <div class="card-badge">موضوع ${j + 1}</div>
                    <div class="card-title">${escapeHtml(sub.name)}</div>
                    <div class="card-meta">
                        <i class="fas fa-circle-question"></i>
                        <span>${sub.questions.length} سؤال</span>
                    </div>
                </div>`;
        });
        html += `</div>`;
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }

    // ---------- الاختبار ----------
    let currentQuestions = [];
    let userAnswers = {};   // qIndex -> option key

    function startQuiz(secIndex, subIndex) {
        const sec = SECTIONS[secIndex];
        currentQuestions = subIndex === -1
            ? sec.subsections.flatMap(s => s.questions)
            : sec.subsections[subIndex].questions;
        userAnswers = {};

        const title = subIndex === -1 ? 'اختبار كامل القسم' : sec.subsections[subIndex].name;
        const backAction = `renderSubsections(${secIndex})`;

        let html = `
            <a class="back-btn" onclick="${backAction}">
                <i class="fas fa-arrow-right"></i> رجوع للمواضيع
            </a>
            <div class="quiz-progress">
                <i class="fas fa-pen-to-square"></i> ${escapeHtml(title)}
                &mdash; ${currentQuestions.length} سؤال
            </div>
            <div id="results" class="results"></div>
            <div id="questions-list"></div>
            <div class="quiz-controls">
                <button class="quiz-btn check" onclick="checkAnswers()">
                    <i class="fas fa-check"></i> تحقّق من الإجابات
                </button>
                <button class="quiz-btn reset" onclick="resetQuiz()">
                    <i class="fas fa-rotate-right"></i> إعادة
                </button>
            </div>`;
        app.innerHTML = html;
        renderQuestions();
        window.scrollTo(0, 0);
    }

    function renderQuestions() {
        const list = document.getElementById('questions-list');
        let html = '';
        currentQuestions.forEach((q, qi) => {
            html += `<div class="quiz-question" data-q="${qi}">
                <div class="q-text"><span class="q-num">${qi + 1}.</span> ${escapeHtml(q.question)}</div>`;
            OPTION_KEYS.forEach(key => {
                const text = q['option_' + key];
                if (text == null || text === '') return;
                html += `
                    <div class="quiz-option" data-opt="${key}" onclick="selectOption(${qi}, '${key}')">
                        <span class="opt-letter">${key.toUpperCase()}</span>
                        <span>${escapeHtml(text)}</span>
                    </div>`;
            });
            const exp = q.correct_text || '';
            html += `<div class="explanation" data-exp="${qi}">
                <i class="fas fa-circle-info"></i> الإجابة الصحيحة:
                <strong>${escapeHtml((q.correct_option || '').toUpperCase())}</strong>
                ${exp ? '&mdash; ' + escapeHtml(exp) : ''}
            </div>`;
            html += `</div>`;
        });
        list.innerHTML = html;
    }

    function selectOption(qi, key) {
        userAnswers[qi] = key;
        const qDiv = document.querySelector(`.quiz-question[data-q="${qi}"]`);
        qDiv.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
        qDiv.querySelector(`.quiz-option[data-opt="${key}"]`).classList.add('selected');
    }

    function checkAnswers() {
        let correct = 0;
        currentQuestions.forEach((q, qi) => {
            const qDiv = document.querySelector(`.quiz-question[data-q="${qi}"]`);
            const userKey = userAnswers[qi];
            const correctKey = (q.correct_option || '').toLowerCase();

            qDiv.querySelectorAll('.quiz-option').forEach(o => {
                o.classList.remove('correct', 'incorrect');
                const k = o.getAttribute('data-opt');
                if (k === correctKey) o.classList.add('correct');
                if (k === userKey && userKey !== correctKey) o.classList.add('incorrect');
            });
            const expDiv = qDiv.querySelector('.explanation');
            if (expDiv) expDiv.classList.add('show');
            if (userKey === correctKey) correct++;
        });
        showResults(correct, currentQuestions.length);
    }

    function showResults(correct, total) {
        const pct = total ? (correct / total) * 100 : 0;
        let cls, msg;
        if (pct >= 80)      { cls = 'grade-pass'; msg = 'ممتاز!'; }
        else if (pct >= 60) { cls = 'grade-mid';  msg = 'جيد'; }
        else                { cls = 'grade-fail'; msg = 'يحتاج مراجعة'; }

        const box = document.getElementById('results');
        box.innerHTML = `
            <div class="score">${correct} / ${total}</div>
            <div class="grade ${cls}">${msg} (${Math.round(pct)}%)</div>`;
        box.style.display = 'block';
        box.scrollIntoView({ behavior: 'smooth' });
    }

    function resetQuiz() {
        userAnswers = {};
        document.querySelectorAll('.quiz-option').forEach(o =>
            o.classList.remove('selected', 'correct', 'incorrect'));
        document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show'));
        const box = document.getElementById('results');
        box.style.display = 'none';
        window.scrollTo(0, 0);
    }

    function escapeHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
